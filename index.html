<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Taldangra Fulmati High School - Letter Head</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
    --line-height: 20px;
    --rule-gap: 28px;
    --para-gap: 0px;
}

@page{
    size:A4;
    margin:0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    height:100%;
}

body{
    background:#e6e9ed;
    font-family:'Noto Sans Bengali',sans-serif;
    padding:20px;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
}

.page{
    width:210mm;
    min-height:297mm;
    margin:auto;
    background:#fff;
    box-shadow:0 0 20px rgba(0,0,0,.25);
    position:relative;
    display:flex;
    flex-direction:column;
    padding:10mm 13mm 13mm;
    overflow:hidden;
}

/* Watermark: multiple times tiled across the page background, extremely light and printer-friendly */
.watermark{
    position:absolute;
    inset:0;
    background-repeat:repeat;
    background-position:center;
    background-size:220px 220px;
    opacity:0.04;
    pointer-events:none;
    z-index:0;
}

.header,.memo,.content,.footer,.info-strip,.sign-block,.encl-block,.below-sign-content{
    position:relative;
    z-index:1;
}

/* ===== TOOLBAR (screen only) ===== */
.toolbar{
    position:sticky;
    top:0;
    left:0;
    right:0;
    z-index:50;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:#dbe4ee;
    border-bottom:2px solid #0a4f8f;
    padding:8px 10px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    margin-bottom:12px;
}

.toolbar > button{
    padding:7px 14px;
    font-size:13.5px;
    font-weight:bold;
    color:#fff;
    background:#0a4f8f;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-family:'Noto Sans Bengali',sans-serif;
}

.toolbar > button:hover{ background:#06345e; }

.format-toolbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:5px;
    padding:4px 6px;
    background:#f2f2f2;
    border:1px solid #ccc;
    border-radius:6px;
}

.format-toolbar button,
.format-toolbar select,
.format-toolbar label.color-lbl{
    padding:4px 8px;
    font-size:12.5px;
    color:#1a1a1a;
    background:#fff;
    border:1px solid #999;
    border-radius:4px;
    cursor:pointer;
    font-family:'Noto Sans Bengali',sans-serif;
    display:inline-flex;
    align-items:center;
    gap:3px;
}

.format-toolbar button:hover,
.format-toolbar select:hover,
.format-toolbar label.color-lbl:hover{
    background:#e8e8e8;
}

.format-toolbar input[type="color"]{
    width:18px;
    height:18px;
    border:none;
    padding:0;
    background:none;
    cursor:pointer;
}

.format-toolbar .fdiv{
    width:1px;
    height:20px;
    background:#bbb;
    margin:0 2px;
}

.format-toolbar .btn-active{
    color:#fff !important;
    background:#0a4f8f !important;
    border-color:#0a4f8f !important;
}

.format-toolbar .btn-active:hover{
    background:#06345e !important;
}

/* Visibility Toggles */
.sign-hidden .sign-block{ display:none; }
.encl-hidden .encl-block{ display:none; }
.below-hidden .below-sign-content{ display:none; }
.no-rules .content,
.no-rules .below-sign-content{ background-image:none !important; }

/* MS Word Underline Style Classes */
.u-single{ text-decoration:underline solid currentColor !important; text-underline-offset:3px; }
.u-double{ text-decoration:underline double currentColor !important; text-underline-offset:3px; }
.u-dotted{ text-decoration:underline dotted currentColor !important; text-underline-offset:3px; }
.u-dashed{ text-decoration:underline dashed currentColor !important; text-underline-offset:3px; }
.u-wavy{ text-decoration:underline wavy currentColor !important; text-underline-offset:3px; }
.u-thick{ text-decoration:underline solid currentColor !important; text-decoration-thickness:2.5px !important; text-underline-offset:3px; }
.u-none{ text-decoration:none !important; }

/* ===== TOP INFO STRIP ===== */
.info-strip{
    flex:0 0 auto;
    background:#f0f0f0;
    border:1px solid #000;
    border-radius:6px;
    padding:6px 10px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:6px 22px;
    font-size:13px;
    font-weight:700;
    color:#000;
    margin-bottom:8px;
}

.info-strip .sep{
    color:#888;
    font-weight:400;
}

/* ===== HEADER ===== */
.header{
    flex:0 0 auto;
    background:#ffffff;
    border-bottom:3px solid #000;
    border-top:4px solid #000;
    width:100%;
    overflow:hidden;
}

.header-inner{
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px 10px 10px;
    width:100%;
}

.logo-wrap{
    flex:0 0 auto;
    width:110px;
    height:110px;
    border-radius:50%;
    padding:3px;
    background:#000;
    box-shadow:0 3px 8px rgba(0,0,0,.25);
}

.logo-wrap img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    background:#fff;
    border:2px solid #fff;
}

.title{
    flex:1 1 0%;
    text-align:center;
    min-width:0;
    max-width:100%;
    overflow:hidden;
}

.title .dual-name-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 100%;
}

.title .name-en{
    font-size:26px;
    color:#0a4f8f;
    font-weight:800;
    letter-spacing:.3px;
    text-transform:uppercase;
    line-height:1.2;
    text-align: center;
}

.title .name-bn{
    font-size:31px;
    font-weight:800;
    letter-spacing:.3px;
    line-height:1.25;
    background:linear-gradient(180deg,#FF9933 0%,#FF9933 32%,#1a1a1a 32%,#1a1a1a 68%,#128807 68%,#128807 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    -webkit-text-stroke:0.6px rgba(0,0,0,.35);
    text-shadow:1px 2px 3px rgba(0,0,0,.25);
    text-align: center;
}

.title .estd{
    margin-top:6px;
    display:inline-block;
    font-size:16px;
    color:#000;
    font-weight:700;
    letter-spacing:.3px;
    border:2px solid #000;
    border-radius:999px;
    padding:3px 20px;
    background:#f7f7f7;
}

/* ===== ADDRESS / CONTACT STRIP (Expanded Both Bengali & English) ===== */
.contact-strip{
    background:#f7f7f7;
    color:#000;
    padding:8px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    text-align:center;
    border-top:2px solid #000;
    width:100%;
    overflow:hidden;
}

.contact-strip .addr-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
    align-items: center;
}

.contact-strip .addr{
    font-weight:700;
    width:100%;
    text-align:center;
    font-size:14.5px;
    line-height:1.3;
}

.contact-strip .row2{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:6px 16px;
    width:100%;
    margin-top:2px;
    font-size:13px;
    line-height:1.25;
}

.contact-strip .sep{
    height:14px;
    width:1px;
    background:rgba(0,0,0,.4);
}

.contact-strip .item{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:500;
}

.contact-strip b{
    font-weight:700;
}

/* ===== MEMO LINE ===== */
.memo{
    flex:0 0 auto;
    display:flex;
    flex-wrap:nowrap;
    justify-content:space-between;
    align-items:baseline;
    margin:6px 4px 6px;
    padding:6px 12px;
    font-size:14.5px;
    font-weight:600;
    color:#000;
    white-space:nowrap;
    background:#f8fafc;
    border:1px solid #dde3ea;
    border-radius:6px;
}

.memo span[contenteditable]{
    background:#ffffff;
    border:1px solid #d7dce2;
    border-radius:4px;
    min-width:90px;
    display:inline-block;
    padding:2px 8px;
    margin-left:4px;
    outline:none;
}

/* ===== CONTENT (exact original notepad style, directly editable) ===== */
.content{
    flex:0 0 auto;
    min-height:28px;
    padding:6px 8px 8px;
    font-size:17.0px;
    line-height:var(--line-height);
    color:#1c1c1c;
    outline:none;
    overflow-wrap:break-word;
    word-wrap:break-word;
    word-break:break-word;
    background-image:repeating-linear-gradient(
        to bottom,
        transparent,
        transparent calc(var(--rule-gap) - 1px),
        #dce6f0 var(--rule-gap)
    );
    background-position:0 4px;
}

.content p
